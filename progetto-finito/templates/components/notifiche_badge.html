{# Badge notifiche dell'intestazione: HTMX lo sostituisce ogni 30 secondi e subito quando il WebSocket avvisa (dv:notifiche). #}
<a id="notifiche-badge" href="{% url 'core:notifiche' %}"
   hx-get="{% url 'core:notifiche_contatore' %}" hx-trigger="every 30s, dv:notifiche from:body" hx-swap="outerHTML"
   class="relative inline-flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm text-muted hover:bg-surface-2 hover:text-fg"
   aria-label="Notifiche{% if notifiche_non_lette %}: {{ notifiche_non_lette }} non lett{{ notifiche_non_lette|pluralize:"a,e" }}{% endif %}">
  <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
  {% if notifiche_non_lette %}<span class="rounded-full bg-indigo-600 px-2 py-0.5 text-xs font-semibold text-indigo-50">{{ notifiche_non_lette }}</span>{% endif %}
</a>

{# Uso: {% include "components/alert.html" with tag="success|error|warning|info" testo="..." %} #}
<div role="alert" class="rounded-lg border px-4 py-3 text-sm
  {% if tag == 'success' %}border-emerald-500/30 bg-emerald-500/10 text-emerald-300
  {% elif tag == 'error' %}border-red-500/30 bg-red-500/10 text-red-300
  {% elif tag == 'warning' %}border-amber-500/30 bg-amber-500/10 text-amber-300
  {% else %}border-sky-500/30 bg-sky-500/10 text-sky-300{% endif %}">
  {{ testo }}
</div>

# Parte comune dei due server (HTTP e HTTPS): incluso con `include /etc/nginx/snippets/dv-locations.conf;`
# L'app gira con Daphne (ASGI) su django:8000 e serve HTTP e WebSocket.

# File statici (CSS, JS, admin): raccolti da `collectstatic` in un volume condiviso con l'app.
# L'URL dei nostri CSS/JS ha già ?v=<data>, quindi una cache di un'ora non porta file vecchi.
location /static/ {
    alias /srv/static/;
    access_log off;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

# Non c'è nessuna rotta /media/: i documenti passano sempre da una view che controlla i permessi.
location /media/ { return 404; }

# WebSocket degli avvisi in tempo reale (Fase 9).
location /ws/ {
    include /etc/nginx/snippets/dv-proxy.conf;
    proxy_pass http://django:8000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Risposte dell'assistente in streaming (SSE): senza questo Nginx le tratterrebbe fino alla fine.
location ~ ^/chiedi/messaggi/[0-9]+/flusso/$ {
    include /etc/nginx/snippets/dv-proxy.conf;
    proxy_pass http://django:8000;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
}

# Accesso: al massimo qualche tentativo al minuto per indirizzo (si somma al registro dei tentativi falliti).
location = /accounts/login/ {
    limit_req zone=dv_login burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/dv-proxy.conf;
    proxy_pass http://django:8000;
}

location / {
    include /etc/nginx/snippets/dv-proxy.conf;
    proxy_pass http://django:8000;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_request_buffering on;
}

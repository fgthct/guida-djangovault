# Intestazioni verso l'app. Incluso in OGNI location che fa proxy_pass: in Nginx, se una location dichiara anche una
# sola proxy_set_header, perde quelle ereditate dal server (è così che Host e X-Forwarded-* sparirebbero).
# Il browser non deve poter dichiarare da sé il proprio IP o il protocollo: li fissa Nginx.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;  # con la porta, se non è 80/443 (serve al controllo dell'origine di Django)
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $dv_scheme;
